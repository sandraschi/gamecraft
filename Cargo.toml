[workspace]
members = [
    "crates/gamecraft-core",
    "crates/gamecraft-commands",
    "crates/gamecraft-godot",
    "crates/gamecraft-mcp",
    "crates/gamecraft-forge",
    "crates/gamecraft-sim",
    "apps/gamecraft-cli",
    "apps/gamecraft-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
pedantic = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
gamecraft-core = { path = "crates/gamecraft-core" }
gamecraft-commands = { path = "crates/gamecraft-commands" }
gamecraft-godot = { path = "crates/gamecraft-godot" }
gamecraft-sim = { path = "crates/gamecraft-sim" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.30", features = ["serde"] }
nom = "7.1"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
image = "0.25"
gif = "0.13"
