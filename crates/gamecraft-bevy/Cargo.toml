[package]
name = "gamecraft-bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L3 Bevy 0.20 runtime for GameCraft games: logic plugins tested headless, rendering behind the `render` feature"

# Fleet standard (mcd standards/rust-crates/BEVY.md): Bevy lives only in this crate,
# default features off, each feature added back on purpose. Justification is in
# docs/TARGETS_PLAN.md, step 3.
[features]
default = []
# Procedural sound: Bevy's audio output and the WAV decoder (the clips are synthesised
# in `synth.rs` and handed over as WAV bytes). No ogg/mp3/flac, no spatial audio use.
audio = ["bevy/bevy_audio", "bevy/wav"]
# Window, PBR rendering, keyboard and sound: what the playable binary needs. No UI,
# sprites, scenes, picking or gamepad.
render = [
    "audio",
    "bevy/3d_bevy_render",
    "bevy/default_app",
    "bevy/multi_threaded",
    "bevy/bevy_winit",
    "bevy/keyboard",
]
# VRM avatars (Nekomimi-chan). Opt-in: only the avatar work needs it, so render and test
# builds of the other games do not pull it in.
vrm = ["render", "dep:bevy_vrm"]
# Fast relinking while iterating on the binary: `cargo run --features render,dev ...`
dev = ["bevy/dynamic_linking"]

[dependencies]
# Logic only by default: ECS, app, time. `cargo test -p gamecraft-bevy` never builds a renderer.
bevy = { version = "0.20.1", default-features = false, features = ["std"] }
gamecraft-sim = { workspace = true }
# VRM avatars (Nekomimi-chan): unavi bevy_vrm 0.5.0 matches bevy 0.20. Verified 2026-11-04 via scratch resolve.
bevy_vrm = { version = "0.5.0", optional = true }

[[bin]]
name = "gamecraft-bevy-maze"
path = "src/bin/maze.rs"
required-features = ["render"]

[[bin]]
name = "gamecraft-synth-dump"
path = "src/bin/synth_dump.rs"

[[bin]]
name = "gamecraft-bevy-murmuration"
path = "src/bin/murmuration.rs"
required-features = ["render"]

[[bin]]
name = "gamecraft-bevy-nekomimi"
path = "src/bin/nekomimi.rs"
required-features = ["render"]

[[bin]]
name = "gamecraft-bevy-railway"
path = "src/bin/railway.rs"
required-features = ["render"]

[dev-dependencies]
# Parity tests: the real Bevy schedule must land on the same result as a replay.
gamecraft-replay = { workspace = true }

[lints]
workspace = true
